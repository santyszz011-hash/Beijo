<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um Beijo 💋</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* TELA INICIAL */
        #inicio {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffb6c9, #ff5f91);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .coracao {
            font-size: 75px;
            animation: pulsar 1.2s infinite;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: 30px;
            margin-bottom: 12px;
        }

        p {
            color: white;
            font-size: 17px;
            margin-bottom: 35px;
        }

        #botao {
            border: none;
            background: white;
            color: #f04478;
            font-size: 19px;
            font-weight: bold;
            padding: 18px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        #botao:active {
            transform: scale(0.92);
        }

        /* TELA DO BEIJO */
        #telaBeijo {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ff8fb1, #ff477e);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #beijo {
            font-size: 70px;
            animation: beijo 1.5s ease forwards;
        }

        /* TELA DO VÍDEO */
        #telaVideo {
            position: fixed;
            inset: 0;
            background: black;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        /* CORAÇÕES */
        .coracaoFlutuante {
            position: fixed;
            bottom: -60px;
            font-size: 25px;
            animation: subir 4s linear forwards;
            pointer-events: none;
            z-index: 15;
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes beijo {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }

            30% {
                transform: scale(1.4);
                opacity: 1;
            }

            60% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @keyframes subir {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- TELA INICIAL -->
    <div id="inicio">

        <div class="coracao">💗</div>

        <h1>Tenho uma coisa pra você...</h1>

        <p>Mas primeiro aperta aqui 👀</p>

        <button id="botao" onclick="receberBeijo()">
            Receber um beijo 💋
        </button>

    </div>


    <!-- TELA DO BEIJO -->
    <div id="telaBeijo">
        <div id="beijo">💋</div>
    </div>


    <!-- ÁUDIO REAL DO BEIJO -->
    <audio id="somBeijo" preload="auto">
        <source src="beijo.mp3" type="audio/mpeg">
    </audio>


    <!-- VÍDEO -->
    <div id="telaVideo">

        <video id="video" playsinline>
            <source src="video.mp4" type="video/mp4">

            Seu navegador não conseguiu reproduzir o vídeo.
        </video>

    </div>


    <script>

        function receberBeijo() {

            // Esconde a tela inicial
            document.getElementById("inicio").style.display = "none";

            // Mostra a tela do beijo
            document.getElementById("telaBeijo").style.display = "flex";

            // Toca o beijo
            const som = document.getElementById("somBeijo");

            som.currentTime = 0;

            som.play().catch(function() {
                console.log("Não foi possível reproduzir o áudio.");
            });

            // Solta corações
            criarCoracoes();

            // Depois do beijo, mostra o vídeo
            setTimeout(function() {

                document.getElementById("telaBeijo").style.display = "none";

                const telaVideo =
                    document.getElementById("telaVideo");

                const video =
                    document.getElementById("video");

                telaVideo.style.display = "flex";

                video.currentTime = 0;

                video.play().catch(function() {
                    console.log("Toque no vídeo para reproduzir.");
                });

            }, 1700);
        }


        function criarCoracoes() {

            for (let i = 0; i < 20; i++) {

                setTimeout(function() {

                    const coracao =
                        document.createElement("div");

                    coracao.className =
                        "coracaoFlutuante";

                    coracao.innerHTML =
                        Math.random() > 0.5
                        ? "💗"
                        : "💋";

                    coracao.style.left =
                        Math.random() * 100 + "vw";

                    coracao.style.fontSize =
                        (20 + Math.random() * 30) + "px";

                    coracao.style.animationDuration =
                        (3 + Math.random() * 2) + "s";

                    document.body.appendChild(coracao);

                    setTimeout(function() {
                        coracao.remove();
                    }, 6000);

                }, i * 70);
            }
        }

    </script>

</body>
</html>
