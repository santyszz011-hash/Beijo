<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um Beijo 💋</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* =========================
           TELA INICIAL
        ========================= */

        #inicio {
            width: 100%;
            height: 100%;
            min-height: 100vh;

            background:
                radial-gradient(circle at 50% 20%, rgba(255,255,255,.25), transparent 30%),
                linear-gradient(135deg, #ffb6c9, #ff5f91);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 25px;

            transition: opacity .6s ease;
        }

        .coracao {
            font-size: 78px;
            margin-bottom: 20px;

            animation: pulsar 1.2s infinite;
        }

        h1 {
            color: white;
            font-size: 30px;
            margin-bottom: 12px;

            text-shadow:
                0 3px 10px rgba(0,0,0,.15);
        }

        p {
            color: white;
            font-size: 17px;
            margin-bottom: 35px;
        }

        #botao {
            border: none;

            background: white;
            color: #f04478;

            font-size: 19px;
            font-weight: bold;

            padding: 18px 30px;

            border-radius: 50px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.20);

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        #botao:active {
            transform: scale(.91);

            box-shadow:
                0 5px 15px rgba(0,0,0,.20);
        }


        /* =========================
           TELA DO BEIJÃO
        ========================= */

        #telaBeijo {
            position: fixed;

            inset: 0;

            background:
                radial-gradient(circle, #ffb2c7, #ff4d82);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 10;
        }

        #beijo {
            font-size: 80px;

            animation:
                beijoAnimacao 1.6s ease forwards;
        }


        /* =========================
           TELA DO VÍDEO
        ========================= */

        #telaVideo {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: black;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 20;
        }

        #video {
            width: 100%;
            height: 100%;

            object-fit: contain;

            background: black;
        }


        /* =========================
           CORAÇÕES
        ========================= */

        .coracaoFlutuante {
            position: fixed;

            bottom: -60px;

            pointer-events: none;

            z-index: 15;

            animation:
                subir 4s linear forwards;
        }


        /* =========================
           ANIMAÇÕES
        ========================= */

        @keyframes pulsar {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        @keyframes beijoAnimacao {

            0% {
                transform: scale(.2);
                opacity: 0;
            }

            25% {
                transform: scale(1.4);
                opacity: 1;
            }

            55% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }


        @keyframes subir {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            to {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         TELA INICIAL
    ================================== -->

    <div id="inicio">

        <div class="coracao">
            💗
        </div>

        <h1>
            Tenho uma coisa pra você...
        </h1>

        <p>
            Mas primeiro aperta aqui 👀
        </p>

        <button
            id="botao"
            onclick="receberBeijo()">

            Receber um beijo 💋

        </button>

    </div>



    <!-- =================================
         TELA DO BEIJÃO
    ================================== -->

    <div id="telaBeijo">

        <div id="beijo">
            💋
        </div>

    </div>



    <!-- =================================
         ÁUDIO REAL DO BEIJO
    ================================== -->

    <audio
        id="somBeijo"
        preload="auto">

        <source
            src="beijo.mp3"
            type="audio/mpeg">

    </audio>



    <!-- =================================
         VÍDEO
    ================================== -->

    <div id="telaVideo">

        <video
            id="video"
            playsinline
            controls>

            <source
                src="copy_3643711C-5984-48E7-9552-C840D7E6E67C.mov"
                type="video/quicktime">

            Seu navegador não conseguiu reproduzir o vídeo.

        </video>

    </div>



    <script>

        /* =================================
           FUNÇÃO PRINCIPAL
        ================================== */

        function receberBeijo() {

            const inicio =
                document.getElementById("inicio");

            const telaBeijo =
                document.getElementById("telaBeijo");

            const som =
                document.getElementById("somBeijo");

            const video =
                document.getElementById("video");

            const telaVideo =
                document.getElementById("telaVideo");


            /*
             * Esconde a tela inicial
             */

            inicio.style.display = "none";


            /*
             * Mostra o beijão
             */

            telaBeijo.style.display = "flex";


            /*
             * Reinicia o áudio
             */

            som.currentTime = 0;


            /*
             * Toca o beijo REAL
             */

            som.play().catch(function(erro) {

                console.log(
                    "Erro ao tocar o beijo:",
                    erro
                );

            });


            /*
             * Animações
             */

            criarCoracoes();


            /*
             * Depois do beijo:
             * abre o vídeo
             */

            setTimeout(function() {

                telaBeijo.style.display = "none";

                telaVideo.style.display = "flex";

                video.currentTime = 0;


                /*
                 * Tenta iniciar automaticamente
                 */

                video.play().catch(function(erro) {

                    console.log(
                        "O navegador bloqueou o autoplay:",
                        erro
                    );

                });

            }, 1700);

        }



        /* =================================
           CORAÇÕES
        ================================== */

        function criarCoracoes() {

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                setTimeout(function() {

                    const coracao =
                        document.createElement("div");


                    coracao.className =
                        "coracaoFlutuante";


                    coracao.innerHTML =
                        Math.random() > .5
                        ? "💗"
                        : "💋";


                    coracao.style.left =
                        Math.random() * 100 + "vw";


                    coracao.style.fontSize =
                        (20 + Math.random() * 30) + "px";


                    coracao.style.animationDuration =
                        (3 + Math.random() * 2) + "s";


                    document.body.appendChild(
                        coracao
                    );


                    setTimeout(function() {

                        coracao.remove();

                    }, 6000);

                }, i * 70);

            }

        }

    </script>

</body>
</html>
