<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Um Beijo 💋</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #ffeef3);
  height: 100vh;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;
}

.box {
  width: 90%;
  max-width: 400px;
}

h1 {
  color: #b54969;
  font-size: 34px;
  margin-bottom: 15px;
}

p {
  color: #8c5369;
  font-size: 18px;
  margin-bottom: 35px;
}

button {
  width: 100%;
  padding: 20px;

  border: none;
  border-radius: 40px;

  background: #ff69b4;
  color: white;

  font-size: 20px;
  font-weight: bold;

  box-shadow: 0 8px 20px #b5496940;

  transition: transform 0.15s;
}

button:active {
  transform: scale(0.94);
}

#mensagem {
  margin-top: 25px;

  color: #b54969;
  font-size: 18px;
  font-weight: bold;

  min-height: 30px;
}

.beijo {
  position: fixed;

  left: 50%;
  bottom: 30%;

  font-size: 60px;

  pointer-events: none;

  animation: subir 2s forwards;
}

@keyframes subir {

  0% {
    opacity: 1;
    transform:
      translate(-50%, 0)
      scale(0.4)
      rotate(-10deg);
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(-50% + var(--x)),
        -300px
      )
      scale(1.7)
      rotate(15deg);
  }
}

.coracao {
  position: fixed;

  font-size: 25px;

  pointer-events: none;

  animation: coracao 2.5s forwards;
}

@keyframes coracao {

  0% {
    opacity: 1;
    transform: translateY(0) scale(0.5);
  }

  100% {
    opacity: 0;
    transform: translateY(-400px) scale(1.5);
  }
}
</style>
</head>

<body>

<div class="box">

  <h1>💗 Um Beijo 💋</h1>

  <p>
    Aperte o botão para receber um beijo...
  </p>

  <button onclick="mandarBeijo()">
    💋 Mandar um Beijo
  </button>

  <div id="mensagem">
    ❤️
  </div>

</div>


<script>

let audio = null;
let musicaTocando = false;


/* =========================
   BOTÃO
========================= */

function mandarBeijo() {

  beijoAnimacao();

  somBeijo();

  iniciarMusica();

  document.getElementById("mensagem").innerText =
    "💋 Um beijo só para você ❤️";

}


/* =========================
   BEIJO NA TELA
========================= */

function beijoAnimacao() {

  let beijo = document.createElement("div");

  beijo.className = "beijo";

  beijo.innerText = "💋";

  beijo.style.setProperty(
    "--x",
    ((Math.random() - 0.5) * 220) + "px"
  );

  document.body.appendChild(beijo);

  setTimeout(() => {
    beijo.remove();
  }, 2000);


  /* corações */

  for (let i = 0; i < 5; i++) {

    let coracao = document.createElement("div");

    coracao.className = "coracao";

    coracao.innerText = "❤️";

    coracao.style.left =
      (30 + Math.random() * 40) + "%";

    coracao.style.bottom = "30%";

    coracao.style.animationDelay =
      (Math.random() * 0.4) + "s";

    document.body.appendChild(coracao);

    setTimeout(() => {
      coracao.remove();
    }, 3000);
  }
}


/* =========================
   SOM DO BEIJO
========================= */

function somBeijo() {

  try {

    let AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    let ctx = new AudioContext();

    let osc = ctx.createOscillator();

    let ganho = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      900,
      ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      300,
      ctx.currentTime + 0.18
    );

    ganho.gain.setValueAtTime(
      0.35,
      ctx.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.01,
      ctx.currentTime + 0.18
    );

    osc.connect(ganho);

    ganho.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime + 0.18
    );

  } catch (e) {}

}


/* =========================
   MÚSICA ROMÂNTICA
========================= */

function iniciarMusica() {

  if (musicaTocando) return;

  musicaTocando = true;

  try {

    let AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    audio = new AudioContext();

    tocarMelodia();

  } catch (e) {}

}


function tocarMelodia() {

  if (!audio) return;


  const notas = [

    261.63, 329.63, 392.00,
    329.63, 293.66, 349.23,
    440.00, 349.23,

    261.63, 329.63, 392.00,
    440.00, 392.00, 329.63,
    293.66, 261.63

  ];


  let tempo = 0.45;


  notas.forEach((frequencia, i) => {

    let osc = audio.createOscillator();

    let ganho = audio.createGain();

    osc.type = "sine";

    osc.frequency.value = frequencia;


    let inicio =
      audio.currentTime +
      i * tempo;


    ganho.gain.setValueAtTime(
      0,
      inicio
    );

    ganho.gain.linearRampToValueAtTime(
      0.08,
      inicio + 0.03
    );

    ganho.gain.exponentialRampToValueAtTime(
      0.001,
      inicio + tempo
    );


    osc.connect(ganho);

    ganho.connect(audio.destination);


    osc.start(inicio);

    osc.stop(
      inicio + tempo
    );

  });


  /* repete a música */

  setTimeout(() => {

    if (musicaTocando) {
      tocarMelodia();
    }

  }, notas.length * tempo * 1000);

}

</script>

</body>
</html>
